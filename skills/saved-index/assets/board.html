<style>
/* Layout: Saved Index design by Andrea Cadioli (andreacadioli.com) — white page, black ink, the images carry all colour.
   Unbounded 900 caps for titles, Fraunces thin italic for voice, DM Mono caps for every control. Hovering a post flips the page to black. */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --ink:#111111; --muted:#6B6B6B; --line:#111111; --hair:#E4E4E4; --chip:#F2F2F2;
  --accent:#111111; --accent-ink:#FFFFFF;
  --display:"Unbounded","Arial Black",sans-serif;
  --serif:"Fraunces",Georgia,serif;
  --body:"Fraunces",Georgia,serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --plate-l:88%; --plate-s:0%; --plate-ink:#111111;
  --gut:clamp(16px,3vw,40px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --panel:#000000; --ink:#FFFFFF; --muted:#9A9A9A; --line:#FFFFFF; --hair:#262626; --chip:#141414;
  --accent:#FFFFFF; --accent-ink:#000000; --plate-l:24%; --plate-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#000000; --ink:#FFFFFF; --muted:#9A9A9A; --line:#FFFFFF; --hair:#262626; --chip:#141414;
  --accent:#FFFFFF; --accent-ink:#000000; --plate-l:24%; --plate-ink:#FFFFFF; color-scheme:dark}
/* hovering a post: the whole page goes dark, like the Archive */
body.hov{--bg:#000000;--panel:#000000;--ink:#FFFFFF;--muted:#9A9A9A;--line:#FFFFFF;--hair:#262626;--chip:#141414;--accent:#FFFFFF;--accent-ink:#000000}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:300 16px/1.45 var(--serif);margin:0;transition:background .6s ease,color .6s ease}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.mono,.lbl,.ar,.sb,.seg button,.qmode button,.chip,.btn,.pill,select,.search input,.crumbs .meta,.qstatus,#mapNote,.lkey,.kv dt{font-family:var(--mono);font-weight:300;text-transform:uppercase;letter-spacing:.02em}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;padding:22px 20px 40px var(--gut);transition:background .6s ease}
.brand{display:flex;flex-direction:column;gap:6px;min-height:44px}
.brand .nm{display:flex;align-items:baseline;white-space:pre;font:300 13px/44px var(--mono);text-transform:uppercase;letter-spacing:.02em}
.brand .nm span{display:inline-block}
.brand .nm span.sf{font:italic 100 26px/1 var(--serif);text-transform:none;letter-spacing:0}
.brand small{display:block;font:300 11px/1.4 var(--mono);text-transform:uppercase;color:var(--muted)}
.rail{display:flex;flex-direction:column;margin-top:26px;border-top:1px solid var(--line)}
.ar{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;text-align:left;border:0;border-bottom:1px solid var(--hair);background:none;padding:6px 0;cursor:pointer;font-size:12px;color:var(--ink);opacity:.62;transition:opacity .2s}
.ar:hover{opacity:1}
.ar[aria-current="true"]{opacity:1;text-decoration:underline;text-underline-offset:4px}
.sw{display:none}
.ar .n,.sb .n{margin-left:auto;font:300 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.subs{display:flex;flex-direction:column;padding:4px 0 10px 14px;border-bottom:1px solid var(--hair)}
.sb{border:0;background:none;text-align:left;padding:5px 0;cursor:pointer;display:flex;gap:8px;font-size:11px;color:var(--ink);opacity:.55;min-height:30px;align-items:center}
.sb:hover{opacity:1}
.sb[aria-current="true"]{opacity:1;text-decoration:underline;text-underline-offset:4px}
main{min-width:0;padding-inline:var(--gut) var(--gut);padding-block:0 80px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:18px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);transition:background .6s ease}
.row{display:flex;gap:6px 22px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;gap:0 20px;flex-wrap:wrap;background:none;border:0}

.seg button:hover{opacity:1}
.seg button[aria-pressed="true"]{opacity:1;text-decoration:underline;text-underline-offset:5px}

.active{display:flex;gap:4px 18px;flex-wrap:wrap;margin-top:14px}

.pill::after{content:"×";text-decoration:none;font-size:14px}
/* overview: one card per area, a 2x2 mosaic of its posts, the name in Unbounded below */
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(150px,calc((100% - 4*40px)/5)),1fr));gap:56px 40px;margin-top:40px}
.tile{border:0;background:none;text-align:left;cursor:pointer;padding:0;display:flex;flex-direction:column;gap:12px;color:var(--ink)}

.tile .mos span{display:block;width:100%;height:100%;background-repeat:no-repeat;background-color:var(--chip)}
.tile b{font:900 14px/1.15 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.tile .big{font:300 11px var(--mono);text-transform:uppercase;color:var(--muted);order:3}
.tile .ss{display:none}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(150px,calc((100% - 5*28px)/6)),1fr));gap:52px 28px;margin-top:40px}
.card{display:flex;flex-direction:column;gap:0;min-width:0;cursor:pointer;border:0;background:none;padding:0;text-align:left;position:relative;color:var(--ink)}
.plate{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--chip);color:var(--ink);padding:12px;display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.2,.7,.2,1),opacity .45s ease,filter .45s ease}
.plate .q{font:italic 300 15px/1.2 var(--serif);display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.plate .q.empty{opacity:.55}
.plate .h{margin-top:auto;padding-right:44px;font:300 10px var(--mono);text-transform:uppercase;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plate .spr{position:absolute;inset:0;background-repeat:no-repeat}
.plate .tag{position:absolute;top:8px;right:8px;background:#000;color:#fff;font:300 10px var(--mono);text-transform:uppercase;padding:2px 6px}
.cm{display:flex;flex-direction:column;gap:3px;min-width:0;padding-top:10px;transition:opacity .3s ease}
.cm .who{font:900 12px/1.2 var(--display);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm .sub{font:300 10px var(--mono);text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.cm .sub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (hover:hover){
  .grid .cm{position:absolute;left:0;right:0;top:100%;opacity:0;pointer-events:none}
  .grid .card.on .cm{opacity:1}
  body.hov .grid .card:not(.on) .plate,body.hov .ov .tile:not(.on) .mos{opacity:.2;filter:grayscale(1)}
  .grid .card.on .plate,.ov .tile.on .mos{transform:scale(1.06)}
}
.more{display:flex;justify-content:center;margin-top:56px}
.empty-state{padding:60px 0;color:var(--muted);font:italic 300 22px/1.3 var(--serif);max-width:40ch}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg);z-index:21;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 28px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;border-left:1px solid var(--line)}
.drawer h2{font:900 26px/1 var(--display);text-transform:uppercase;margin:0;letter-spacing:-.02em;overflow-wrap:anywhere}
.drawer .cap{white-space:pre-wrap;overflow-wrap:anywhere;max-width:60ch;font:300 17px/1.5 var(--serif)}
.kv{display:grid;grid-template-columns:100px minmax(0,1fr);gap:0;font:300 15px/1.4 var(--serif);border-top:1px solid var(--line)}
.kv dt,.kv dd{padding:9px 0;border-bottom:1px solid var(--hair)}
.kv dt{font-size:10px;line-height:1.9;color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.open{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);text-decoration:none;font:300 12px var(--mono);text-transform:uppercase;padding:12px 18px;min-height:44px;border:1px solid var(--ink)}
.open:hover{background:var(--bg);color:var(--ink)}

.menu-btn{display:none}

#map{position:relative;margin-top:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;background:var(--bg)}
#map.grabbing{cursor:grabbing}

#mapc{display:block}
#hit{position:absolute;display:block;outline:1px solid var(--ink);outline-offset:2px;cursor:pointer}
#tip{position:absolute;pointer-events:none;max-width:270px;background:var(--bg);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:3px;font:300 14px/1.35 var(--serif)}
#tip b{font:900 12px/1.2 var(--display);text-transform:uppercase}
#tip span{color:var(--muted);font:300 10px var(--mono);text-transform:uppercase}#tip em{font-style:italic;margin-top:3px;overflow-wrap:anywhere}#tip small{font:300 10px var(--mono);text-transform:uppercase;margin-top:5px;text-decoration:underline;text-underline-offset:3px}
.arrctl{position:absolute;left:14px;top:12px;background:var(--bg);padding:0 10px}
.arrctl button{font-size:11px;min-height:36px}
.lkcard{position:absolute;left:14px;top:14px;width:min(340px,calc(100% - 84px));max-height:calc(100% - 70px);overflow:auto;background:var(--bg);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:12px;cursor:default}
.lkey{font-size:10px;letter-spacing:.06em;color:var(--muted)}
.lkhead{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer;color:var(--ink)}
.lkhead b{font:italic 100 30px/1 var(--serif);letter-spacing:-.01em}
.lkcard.min .lkbody{display:none}
.lkbody{display:flex;flex-direction:column;gap:14px}
.lkfam{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.lkfam .lkey{color:var(--ink)!important}
.lkchips{display:flex;flex-wrap:wrap;gap:2px 14px}
.lkchip{border:0;background:none;padding:3px 0;font:300 11px var(--mono);text-transform:uppercase;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;color:var(--ink);opacity:.62;min-height:28px}
.lkchip:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.lkchip span{font-size:10px;color:var(--muted)}
.lkstack{display:flex;flex-direction:column;gap:14px;position:relative}
.lkstack::before{content:"";position:absolute;left:17px;top:24px;bottom:22px;width:1px;background:var(--ink)}
.lkrow{display:flex;gap:14px;align-items:center;position:relative}
.lkrow>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.lknode{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--ink);background:var(--bg);position:relative}
.lknode::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--ink)}
.lknode.sq{border-radius:0}.lknode.sq::after{border-radius:0;inset:12px}
.lkf{font:italic 100 34px/1 var(--serif);letter-spacing:-.01em}
.lkt{font:900 17px/1.1 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.lkn{font:italic 300 19px/1.2 var(--serif)}
.lkthumbs{width:36px;height:40px;flex:none;position:relative}
.lkthumbs .lkth{position:absolute;top:0;left:0;height:34px;border:1px solid var(--ink);background-repeat:no-repeat}
.lkthumbs .lkth:nth-child(2){left:5px;top:3px}.lkthumbs .lkth:nth-child(3){left:10px;top:6px}
.lkth{display:inline-block;aspect-ratio:4/5;background-repeat:no-repeat;flex:none}
.lkpost{display:flex;gap:14px;align-items:center}
.lkpost>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.lkpost b{font:900 15px/1.1 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.lkact{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
body:not(.mapmode) .lkcard{display:none}
.mapctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:0;border:1px solid var(--line);background:var(--bg)}
.mapctl button{width:44px;height:44px;border:0;border-bottom:1px solid var(--line);background:var(--bg);cursor:pointer;font:300 18px var(--mono);color:var(--ink)}

.mapctl button:hover{background:var(--ink);color:var(--bg)}
#mapNote{position:absolute;left:14px;bottom:14px;font-size:10px;color:var(--ink);background:var(--bg);padding:6px 8px;pointer-events:none;max-width:calc(100% - 90px)}

  .app{grid-template-columns:minmax(0,1fr)}

}

</style>

<div class="app">
  <aside id="rail" aria-label="Categories">
    <div class="brand"><span class="nm" id="brandName" aria-label="Saved Index"></span><small id="total">Loading posts…</small></div>

  </aside>
  <main>
    <div class="bar">
      <div class="row">
        <button class="btn menu-btn" id="menu" aria-controls="rail">Categories</button>

          <option value="old">Oldest saved</option>
          <option value="shuffle">Shuffle</option>

        <select id="year" aria-label="Year posted"><option value="">All years</option></select>

            <div class="mapctl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Show whole map">⤢</button></div>

<script>
const HUES=[222,262,18,140,330,4,290,45,190,95,30,200,60,12,170,120,0];
let D,P=[],thumbs=null;
const st={desc:null,qmode:"words",area:null,sub:null,q:"",fmt:new Set(),col:null,user:null,year:"",sort:"new",shown:0,seed:1};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtN=n=>n.toLocaleString("en-US");
const PAGE=96;

async function boot(){
  D=await (await fetch("posts.json")).json();
  try{const r=await fetch("thumbs.json");if(r.ok)thumbs=await r.json();}catch(e){}
  P=D.posts.map(r=>({id:r[0],code:r[1],kind:r[2],user:r[3],name:r[4],ts:r[5],sub:r[6],area:D.subs[r[6]][0],fmt:r[7],cols:r[8],cap:r[9],tags:r[10],url:r[11],
    yr:r[5]?new Date(r[5]*1000).getFullYear():null,hay:(r[3]+" "+r[4]+" "+r[9]+" "+r[10]).toLowerCase()}));

  e={img:new Image(),ok:false,used:SH.frame};c.set(i,e);SH.pending++;e.img.decoding="async";e.img.src=src;
  const done=ok=>{SH.pending--;e.ok=ok;if(!ok){c.delete(i);return;}trimSheets(level);draw();};
  (e.img.decode?e.img.decode():new Promise((r,j)=>{e.img.onload=r;e.img.onerror=j;})).then(()=>done(true),()=>done(false));
  return null;}
function trimSheets(level){const c=SH[level],cap=SH.cap[level];if(c.size<=cap)return;

function sheet(i){return sheetLevel("f",i);}
/* draw one thumbnail at the cheapest resolution that still looks sharp at this size */
function drawThumb(g,p,x,y,w,h,dark,faint){
  const per=thumbs?thumbs.cols*thumbs.rows:100,idx=thumbs&&thumbs.map[p.id];
  if(idx!==undefined){const si=Math.floor(idx/per),n=idx%per,cx=n%thumbs.cols,cy=Math.floor(n/thumbs.cols);
    if(!faint&&w>=22){
      if(w>=105){const f=sheetLevel("f",si);if(f){g.drawImage(f,cx*200,cy*250,200,250,x,y,w,h);return;}}
      const m=sheetLevel("m",si);if(m){const mw=thumbs.msheets?100:200,mh=thumbs.msheets?125:250;g.drawImage(m,cx*mw,cy*mh,mw,mh,x,y,w,h);return;}}

function markMoving(){M.moving=true;clearTimeout(M.mvT);M.mvT=setTimeout(()=>{M.moving=false;draw();},180);}
const CSS={};let cssFrame=-1;
const css=n=>{if(cssFrame!==SH.frame){for(const k in CSS)delete CSS[k];cssFrame=SH.frame;}return CSS[n]??(CSS[n]=getComputedStyle(document.documentElement).getPropertyValue(n).trim());};
function draw(){if(!M.raf)M.raf=requestAnimationFrame(()=>{M.raf=0;drawNow();});}
function drawNow(){
  const cv=$("#mapc");if(!cv||!canvasMode())return;const g=cv.getContext("2d");SH.frame++;
  const {scale:s,tx,ty,dpr}=M;g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle=css("--bg");g.fillRect(0,0,M.W,M.H);

  const gp=Math.max(tw*GAP,tw>6?1:0);
  const per=thumbs?thumbs.cols*thumbs.rows:100;
  const lkOn=mode==="links"&&LK.disp.size;
  for(const t of M.tiles){
    if(t.x>vx1||t.y>vy1||t.x+TW<vx0||t.y+TH<vy0)continue;

    drawThumb(g,t.p,x,y,w,h,dark,faint);

  }

    const lx=tx+(a.x+1.5)*s,ly=ty+(a.y+3.6)*s;const small=2.6*s<fs;

    let name=a.name.toUpperCase();const maxW=Math.max(30,a.w*s-(small?4:1.5*s));
    while(name.length>3&&g.measureText(name).width>maxW)name=name.slice(0,-2)+"…";
    const by=Math.max(ly,ty+a.y*s+fs+4);
    if(small){const w=g.measureText(name).width;g.fillStyle=css("--bg");g.fillRect(tx+a.x*s,by-fs-2,w+6,fs+6);}
    g.fillStyle=ink;g.save();g.beginPath();g.rect(tx+a.x*s,ty+a.y*s-fs,a.w*s,a.h*s+fs);g.clip();
    g.fillText(name,small?tx+a.x*s+3:lx,by);
    if(fs*0.45>9){g.font=`300 ${Math.min(13,fs*.42)}px ${css("--mono")}`;g.fillStyle=muted;g.fillText((fmtN(a.n)+" posts").toUpperCase(),lx,Math.max(ly,ty+a.y*s+fs+4)+Math.min(16,fs*.55));}
    g.restore();
  }
  if(s*1.0>=8){
    for(const b of M.blocks){
      if(b.x>vx1||b.y>vy1||b.x+b.w<vx0||b.y+b.h<vy0)continue;
      const fs=Math.min(15,s*0.8);g.font=`300 ${fs}px ${css("--mono")}`;g.fillStyle=ink;
      g.save();g.beginPath();g.rect(tx+b.x*s,ty+b.y*s,Math.max(b.w*s,60),2.2*s);g.clip();
      g.fillText(((b.label||D.subs[b.sub][1])+"  ·  "+fmtN(b.ps.length)).toUpperCase(),tx+b.x*s,ty+(b.y+1.6)*s);g.restore();
    }

function tileAt(cx,cy){
  const wx=(cx-M.tx)/M.scale,wy=(cy-M.ty)/M.scale;
  if(mode==="links")return linksTileAt(wx,wy);
  for(const b of M.blocks){
    if(wx<b.x||wx>=b.x+b.w||wy<b.y+2.2||wy>=b.y+b.h)continue;
    const c=Math.floor((wx-b.x)/TW),r=Math.floor((wy-b.y-2.2)/TH),k=r*b.c+c;
    if(c<b.c&&k<b.ps.length)return{p:b.ps[k],x:b.x+c*TW,y:b.y+2.2+r*TH};
  }

}
function placeHit(){
  const a=$("#hit"),tip=$("#tip");const h=M.hover;
  if(!h||M.scale*TW<5){a.hidden=true;tip.hidden=true;return;}
  const z=h.sz||1,x=M.tx+h.x*M.scale,y=M.ty+h.y*M.scale,w=TW*z*M.scale,hh=TH*z*M.scale;
  a.hidden=mode==="links";a.href=h.p.url;a.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${hh}px`;
  a.setAttribute("aria-label","Open post by @"+h.p.user+" on Instagram");
  tip.hidden=false;
  tip.innerHTML=`<b>${esc(h.p.name||h.p.user)}</b><span>@${esc(h.p.user)} · ${esc(D.subs[h.p.sub][1])}</span>${h.p.cap?`<em>${esc(h.p.cap.slice(0,110))}${h.p.cap.length>110?"…":""}</em>`:""}<small>${mode==="links"?"Click to follow its links":"Click to open on Instagram"}</small>`;
  const tw=tip.offsetWidth,th=tip.offsetHeight;
  let lx=x+w+10;if(lx+tw>M.W-6)lx=x-tw-10;if(lx<6)lx=6;
  let ly=y;if(ly+th>M.H-6)ly=M.H-th-6;if(ly<6)ly=6;
  tip.style.left=lx+"px";tip.style.top=ly+"px";
}
function zoomAt(cx,cy,f){
  const ns=Math.max(M.minScale*0.6,Math.min(mode==="links"?60:140,M.scale*f));f=ns/M.scale;
  M.tx=cx-(cx-M.tx)*f;M.ty=cy-(cy-M.ty)*f;M.scale=ns;draw();
}
function mapWire(){
  const wrap=$("#map");const pts=new Map();let drag=null,moved=false,pinch=null;
  const local=e=>{const r=wrap.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  wrap.addEventListener("wheel",e=>{if(e.target.closest("#lkCard"))return;e.preventDefault();cancelAnimationFrame(M.anim);const p=local(e);
    const d=e.deltaMode===1?e.deltaY*16:e.deltaY;markMoving();zoomAt(p.x,p.y,Math.exp(-d*(e.ctrlKey?0.01:0.0022)));},{passive:false});
  wrap.addEventListener("pointerdown",e=>{if(e.target.closest(".mapctl,.arrctl,#lkCard"))return;cancelAnimationFrame(M.anim);const p=local(e);pts.set(e.pointerId,p);moved=false;
    if(pts.size===1)drag={x:p.x,y:p.y,tx:M.tx,ty:M.ty,id:e.pointerId,type:e.pointerType};
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:M.scale,tx:M.tx,ty:M.ty,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};moved=true;}});
  wrap.addEventListener("pointermove",e=>{const p=local(e);
    if(pts.has(e.pointerId))pts.set(e.pointerId,p);

    if(e.pointerType==="mouse"&&!drag){const h=tileAt(p.x,p.y);if((h&&h.p)!==(M.hover&&M.hover.p)){M.hover=h;placeHit();}}

function setArr(a){
  M.arr=a;try{localStorage.setItem("si-arr",a);}catch(e){}

}
function mapUpdate(b){

    document.querySelectorAll("[data-arr]").forEach(b=>b.addEventListener("click",()=>setArr(b.dataset.arr)));M.lo=new Image();M.lo.onload=draw;M.lo.src=(thumbs&&thumbs.lo)||"t/lo.jpg";mapWire();}

  if(mode==="links"){$("#mapNote").textContent=!LK.data?"Loading links…":M.dim?`${what}${fmtN(m.length)} of ${fmtN(P.length)} posts highlighted`:(M.W<600?`${LK.data.traits.length} traits · tap a trait or a post`:`${fmtN(LK.data.ids.length)} posts linked through ${LK.data.traits.length} visual traits · click a trait or a post`);linksCard();}

  mapFocus();draw();

function setMode(m){
